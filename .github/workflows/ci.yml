name: ci
on:
  workflow_dispatch:
  pull_request:
    branches: [hishell-master]
  push:
    branches: [hishell-master]
jobs:
  ci:
    runs-on: ubuntu-24.04-arm
    container:
      image: swr.cn-north-4.myhuaweicloud.com/harmonybrew/ci-runner:latest
    timeout-minutes: 60
    defaults:
      run:
        shell: sh
    steps:
      - run: echo "PATH=$PATH" && command -v node && node --version && pnpm --version && git --version
      - uses: actions/checkout@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test
