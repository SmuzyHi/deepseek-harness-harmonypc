name: ci
on:
  workflow_dispatch:
  pull_request:
    branches: [hishell-master]
  push:
    branches: [hishell-master]
jobs:
  ci:
    runs-on: ubuntu-24.04-arm
    container:
      image: swr.cn-north-4.myhuaweicloud.com/harmonybrew/ci-runner:latest
    timeout-minutes: 90
    defaults:
      run:
        shell: sh
    steps:
      - run: |
          curl -fsSL https://nodejs.org/dist/v26.7.0/node-v26.7.0-linux-arm64.tar.gz -o /tmp/node.tgz
          mkdir -p /opt/node && tar -xzf /tmp/node.tgz -C /opt/node --strip-components=1
          export PATH=/opt/node/bin:$PATH
          node --version && npm install -g pnpm@11.7.0 && pnpm --version && git --version
      - uses: actions/checkout@v4
      - run: export PATH=/opt/node/bin:$PATH && pnpm install --frozen-lockfile
      - run: export PATH=/opt/node/bin:$PATH && pnpm run build
      - run: export PATH=/opt/node/bin:$PATH && pnpm run test
