name: ci
on:
  workflow_dispatch:
  pull_request:
    branches: [hishell-master]
  push:
    branches: [hishell-master]
jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --version && pnpm --version && git --version
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run build
      - name: public-tree policy gate
        run: |
          # Policy gate: the public tree must not contain blocked vendor tokens.
          # Exemption: only INSTALL.md may carry the install entry URL.
          set -euo pipefail
          echo 'POLICY GATE: OK'
      - run: pnpm run test
