name: ci
on:
  workflow_dispatch:
  pull_request:
    branches: [hishell-master]
  push:
    branches: [hishell-master]
jobs:
  ci:
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/smuzyhi/deepseek-harness-harmonypc:ci
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    defaults:
      run:
        shell: sh
    steps:
      - run: node --version && pnpm --version && git --version
      - uses: actions/checkout@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test
